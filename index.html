<!DOCTYPE html>
<html lang="en" data-theme="xen">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Coduis Xen - Enterprise Restaurant Management System" />
  <meta name="theme-color" content="#6366f1" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" type="image/png" href="/logo.png?v=2" />
  <link rel="apple-touch-icon" href="/logo.png?v=2" />
  <link rel="manifest" href="/manifest.json" />
  <!-- Fonts: preconnect + preload + plain stylesheet (display=swap).
       Single family (Cairo) system-wide. NOTE: never use on* inline handlers
       (e.g. media-print + onload tricks) here — the server CSP ships
       script-src-attr 'none', so inline handlers are blocked and the font
       would silently never apply. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" />
  <!-- Non-blocking: the stylesheet is injected by index.tsx after mount
       (same URL, display=swap) so font fetch never delays first paint.
       Boot shell uses system font by design. -->
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" /></noscript>
  <!-- Speculation Rules: the browser prefetches the most-likely next route
       chunk when the user hovers a link (>200ms), so navigation feels
       instant. `prefetch` (not `prerender`) on purpose: zero side effects —
       no API calls, no sockets, no duplicate submissions. Auth-gated routes
       still verify permissions on activation as usual. Deliberately kept to
       the 4 hottest destinations: every extra URL costs bandwidth on load. -->
  <script type="speculationrules">
    {
      "prefetch": [
        {
          "source": "list",
          "urls": ["/pos", "/orders", "/kds", "/dashboard", "/call-center", "/reports", "/finance"],
          "eagerness": "moderate"
        }
      ]
    }
  </script>
  <title>Coduis Xen</title>
  <!-- Critical shell: paints an instant branded placeholder (FCP) before the
       JS bundle parses. React clears #root on mount. Transform/opacity-only
       animations → zero layout/paint cost, no blur, system font only.
       Creative loader: pulsing mark + sweeping progress bar + shimmer ring,
       all compositor-driven (transform/opacity) so it stays 60fps even on
       low-end devices. Same palette as the app boot screen (#020617/indigo). -->
  <style>
    html, body { background: #020617; margin: 0; }
    #root { min-height: 100dvh; }
    .boot-shell { min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: #020617; contain: strict; content-visibility: auto; }
    .boot-inner { display: flex; flex-direction: column; align-items: center; gap: 22px; }
    .boot-ring {
      width: 96px; height: 96px; border-radius: 28px; display: flex; align-items: center; justify-content: center;
      position: relative; isolation: isolate;
    }
    .boot-ring::before {
      content: ""; position: absolute; inset: 0; border-radius: inherit;
      background: conic-gradient(from 0deg, #6366f1, #8b5cf6, #10b981, #6366f1);
      animation: boot-spin 1.8s linear infinite; opacity: 0.9;
    }
    .boot-ring::after { content: ""; position: absolute; inset: 2px; border-radius: 26px; background: #020617; z-index: 0; }
    .boot-mark {
      width: 72px; height: 72px; border-radius: 20px; z-index: 1;
      display: flex; align-items: center; justify-content: center;
      font: 800 26px system-ui, sans-serif; color: #fff; letter-spacing: -0.05em;
      background: linear-gradient(135deg, #6366f1, #4f46e5 60%, #3730a3);
      animation: boot-pulse 1.6s ease-in-out infinite; will-change: transform, opacity;
    }
    .boot-bar { width: 180px; height: 4px; border-radius: 99px; background: rgba(148,163,184,0.15); overflow: hidden; }
    .boot-bar > span {
      display: block; height: 100%; width: 40%; border-radius: inherit;
      background: linear-gradient(90deg, #6366f1, #8b5cf6, #10b981);
      animation: boot-sweep 1.2s ease-in-out infinite; will-change: transform;
    }
    .boot-dots { display: flex; gap: 6px; }
    .boot-dots > span { width: 6px; height: 6px; border-radius: 99px; background: #6366f1; opacity: 0.4; animation: boot-blink 1.2s ease-in-out infinite; }
    .boot-dots > span:nth-child(2) { animation-delay: 0.15s; }
    .boot-dots > span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes boot-pulse { 0%, 100% { opacity: 0.65; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    @keyframes boot-sweep { 0% { transform: translateX(-110%); } 100% { transform: translateX(280%); } }
    @keyframes boot-blink { 0%, 100% { opacity: 0.25; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.1); } }
    @media (prefers-reduced-motion: reduce) { .boot-mark, .boot-ring::before, .boot-bar > span, .boot-dots > span { animation: none; } }
  </style>
  <!-- App stylesheet (project-root index.css incl. Tailwind). Vite resolves
       this at build time into a hashed /assets/index-*.css file — this link
       is the entry point of ALL app CSS, never remove it. -->
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"><div class="boot-shell" aria-hidden="true"><div class="boot-inner"><div class="boot-ring"><div class="boot-mark"><img src="/logo.png?v=2" alt="Xen" style="width:56px;height:56px;object-fit:contain;border-radius:14px;z-index:1" /></div></div><div class="boot-bar"><span></span></div><div class="boot-dots"><span></span><span></span><span></span></div></div></div></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
